name: Build iOS App

on:
  push:
    branches:
      - main  # Runs on push to 'main' branch
  pull_request:
    branches:
      - main  # Runs on pull requests to 'main' branch
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

jobs:
  build-ios:
    runs-on: macos-12  # Use an Intel-based macOS runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"  # Set your Flutter version
          architecture: x64  # Force Intel architecture to avoid ARM issues

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --no-codesign
