jobs:
  build-ios:
    runs-on: macos-13  # Change to macOS-13 for better availability
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          architecture: x64  # Force Intel-based architecture (avoid ARM issues)

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --no-codesign
